<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Todo App</title>
    <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="matrix-banner">
      <img
        class="matrix-banner__image"
        src="./eisenhower-matrix.jpg"
        alt="Eisenhower matrix"
        width="1024"
        height="512" />
      <a class="matrix-banner__link" href="https://goal-life.com/page/method/matrix-eisenhower"
        >Want more details&quest;</a
      >
    </header>
    <main class="todo">
      <section>
        <h1 class="todo__heading-add">Add Item</h1>
        <div class="todo__controls">
          <input id="new-task" class="todo__field" type="text" />
          <button class="todo__add">Add</button>
        </div>
      </section>
      <section>
        <h2 class="todo__heading">Todo</h2>
        <ul id="incomplete-tasks" class="todo__items">
          <li class="todo__item">
            <input class="todo__item-toggle" type="checkbox" />
            <label class="todo__item-title">Pay Bills</label>
            <input class="todo__item-input" type="text" />
            <button class="todo__item-edit" type="button">Edit</button>
            <button class="todo__item-delete" type="button">
              <img class="todo__delete-icon" src="./remove.svg" alt="Delete" />
            </button>
          </li>
          <li class="todo__item todo__item-editing">
            <input class="todo__item-toggle" type="checkbox" />
            <label class="todo__item-title">Go Shopping</label>
            <input class="todo__item-input" type="text" value="Go Shopping" />
            <button class="todo__item-edit" type="button">Save</button>
            <button class="todo__item-delete" type="button">
              <img class="todo__delete-icon" src="./remove.svg" alt="Delete" />
            </button>
          </li>
        </ul>
      </section>
      <section>
        <h2 class="todo__heading">Completed</h2>
        <ul id="completed-tasks" class="todo__items todo__items-completed">
          <li class="todo__item">
            <input class="todo__item-toggle" type="checkbox" checked />
            <label class="todo__item-title">See the Doctor</label>
            <input class="todo__item-input" type="text" />
            <button class="todo__item-edit" type="button">Edit</button>
            <button class="todo__item-delete" type="button">
              <img class="todo__delete-icon" src="./remove.svg" alt="Delete" />
            </button>
          </li>
        </ul>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
